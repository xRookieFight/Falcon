name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Configure
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=g++ -DCMAKE_MAKE_PROGRAM=ninja

      - name: Build
        shell: msys2 {0}
        run: cmake --build build -j2

      - name: Verify executable
        shell: msys2 {0}
        run: |
          test -f build/Falcon.Server/FalconServer.exe
          file build/Falcon.Server/FalconServer.exe

      - uses: actions/upload-artifact@v4
        with:
          name: FalconServer
          path: build/Falcon.Server/FalconServer.exe
